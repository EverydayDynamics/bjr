[package]
# TODO(1) fix `authors` and `name` if you didn't use `cargo-generate`
authors = ["edbuilds <edbuildsoriginal@gmail.com>"]
name = "bjr_bsp"
edition = "2021"
version = "0.1.0"

[lib]
harness = false

# needed for each integration test
[[test]]
name = "integration"
harness = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true}
cortex-m-semihosting = { version ="0.5.0" , optional = true}
embedded-hal = { version = "1.0.0", optional = true }
bsp_traits = { path = "../bsp_traits", version = "0.1.0" }
rtt-target = { version = "0.5.0", optional = true }

stm32f4xx-hal= {version = "0.21.0", features = ["stm32f446", "rtic2"], optional = true}
tmc5130 = { path = "../../../TMC5130", optional = true}
tsc2046 = {version = "0.1.0", optional = true}

log = {version ="0.4", optional = true}
env_logger = {version = "0.11.5", optional = true}

[dev-dependencies]
defmt-test = "0.3"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 'z'         # <-
overflow-checks = true  # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

[features]
default = []
std = []
embedded = ["dep:cortex-m", "dep:cortex-m-rt", "dep:cortex-m-semihosting", "dep:embedded-hal"]
mock_board = ["dep:log", "dep:env_logger", "std"]
main_board = ["embedded","dep:stm32f4xx-hal", "dep:tmc5130", "dep:tsc2046", "dep:rtt-target"]
