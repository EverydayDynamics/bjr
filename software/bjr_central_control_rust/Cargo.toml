[package]
# TODO(1) fix `authors` and `name` if you didn't use `cargo-generate`
authors = ["tamasfeher <tamas@automata.tech>"]
name = "bjr"
edition = "2021"
version = "0.1.0"

[lib]
harness = false

# needed for each integration test

[dependencies]
bjr_logic = { path = "../bjr_logic", version = "0.1.0", features = [] }
bsp_traits = { path = "../bsp_traits", version = "0.1.0", features = [] }
os_traits = {path = "../os_traits"}
bjr_bsp = { path = "../bjr_bsp", version = "0.1.0", features = ["main_board"]}
bjr_builder = { path = "../bjr_builder", version = "0.1.0", features = []}
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "0.3.1", features = [] }
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.1.1", features = [ "thumbv7-backend"  ] }
rtic-monotonics = { version = "1.5.0", features = [ "cortex-m-systick", "stm32_tim2","stm32f446re", ]}
rtic-core = "1.0.0"
embedded-time = "0.12.1"
strum = { version = "0.26.3", default-features = false, features = ["derive"] }
strum_macros = "0.26.4"
defmt = "0.3.8"

[dependencies.stm32f4xx-hal]
version = "0.20.0"
features = ["stm32f446", "rtic2"]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 'z'         # <-
overflow-checks = true  # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 's'            # <-
overflow-checks = false  # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

[features]
default = []
defmt = ["bsp_traits/defmt", "bjr_bsp/defmt", "bjr_builder/defmt", "bjr_logic/defmt"]