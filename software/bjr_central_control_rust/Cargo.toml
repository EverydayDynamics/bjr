[package]
# TODO(1) fix `authors` and `name` if you didn't use `cargo-generate`
authors = ["tamasfeher <tamas@automata.tech>"]
name = "bjr"
edition = "2021"
version = "0.1.0"

[lib]
harness = false

# needed for each integration test
[[test]]
name = "integration"
harness = false

[[test]]
name = "TSC5130"
harness = false

[[test]]
name = "TSC2046"
harness = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3.6"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.1.1", features = [ "thumbv7-backend"  ] }
rtic-monotonics = { version = "1.5.0", features = [ "cortex-m-systick" ]}
rtic-core = "1.0.0"
embedded-hal = "1.0.0"
tmc5130 = {path = "../../../TMC5130", features = ["defmt"]}
tsc2046 = "0.1.0"

[dependencies.stm32f4xx-hal]
version = "0.20.0"
features = ["stm32f446", "rtic2"]

[dev-dependencies]
defmt-test = "0.3.2"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 'z'         # <-
overflow-checks = true  # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3           # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3            # <-
overflow-checks = false  # <-

