[package]
name = "bjr-central-controller"
version = "1.1.0"
authors = ["Tamas Feher tamas@edbuilds.net"]
edition = "2021"

[dependencies]
embedded-hal = "0.2.7"

[dependencies.panic-halt]
version = "0.2.0"


[dev-dependencies]
mockall = "0.11.4"

[target.thumbv7em-none-eabihf.dependencies]
