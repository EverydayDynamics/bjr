[package]
name = "bjr-central-controller"
version = "0.1.0"
authors = ["Tamas Feher tamas@edbuilds.net"]
edition = "2021"

[dependencies]
embedded-hal = "0.2.7"

[dependencies.panic-halt]
version = "0.2.0"


[dev-dependencies]
mockall = "0.11.4"

[target.'cfg(target_arch = "thumbv7em")'.dependencies]
cortex-m-rtic = "1.1.4"
systick-monotonic = "1.0.0"

[target.'cfg(target_arch = "thumbv7em")'.dependencies.rtt-target]
version = "0.3.1"
features = ["cortex-m"]

[target.'cfg(target_arch = "thumbv7em")'.dependencies.stm32f4xx-hal]
version = "0.17.1"
features = ["stm32f446", "rtic"]

[[bin]]
name = "app"
path = "src/main.rs"
test = true
bench = false
